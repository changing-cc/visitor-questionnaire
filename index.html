<!DOCTYPE html>
<!--
  访客问卷（试做）

  和「近期连环命案汇总」用同一套字体、颜色、线条。
  题目、选项、提示、结尾的两句话都没有动，只换了样子。原来的问卷文件一个字没改。

  答案和原来的问卷存在同一个地方（localStorage：visitor-questionnaire-001-v1），
  格式也一样，所以两边是通的。

  2026.11.16  试做
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="访客问卷：关于你的一些问题。">
<title>访客问卷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap">

<style>
/*
  样式。和主页面是一套。
  颜色：底 #f5f7f7　纸 #fbfcfc　字 #202426　灰 #646d71　浅灰 #a3abaf　线 #d5dbdd
  整页只有结尾的第二句是红的。没填的题不用红字提醒，用深一点的字。
*/

* { box-sizing: border-box; }

[hidden] { display: none !important; }

html {
  overflow-x: hidden;
  color-scheme: light;
}

html, body {
  margin: 0;
  background: #f5f7f7;
  color: #202426;
}

body {
  position: relative;
  padding: 0 16px;
  font-family: "Noto Serif SC", "Songti SC", "SimSun", "STSong", serif;
  font-size: 15px;
  line-height: 1.85;
}

::selection {
  background: transparent;
  color: inherit;
}
/* 填字的框里要看得见自己选中了什么 */
input::selection {
  background: #d5dbdd;
  color: inherit;
}

a {
  color: #2f4a63;
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-thickness: 1px;
}

button, input {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 1px solid #202426;
  outline-offset: 2px;
}

.page {
  position: relative;
  z-index: 2;
  max-width: 780px;
  margin: 0 auto;
  padding: 20px 0 72px;
}

/* 纸面颗粒 */
#grain {
  position: fixed;
  top: 0; right: 0; bottom: 0; left: 0;
  z-index: 1;
  opacity: .5;
  pointer-events: none;
}

/* 只给读屏软件念的字 */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}


/* ---- 按钮 ---- */

.btn {
  padding: 3px 16px;
  border: 1px solid #d5dbdd;
  border-radius: 0;
  background: #fbfcfc;
  font-size: 14px;
  cursor: pointer;
}
.btn:hover { border-color: #646d71; }
.btn:disabled {
  color: #a3abaf;
  cursor: default;
}
.btn:disabled:hover { border-color: #d5dbdd; }

/* 长得像一行字的按钮（清空回答） */
.plain {
  padding: 0;
  border: 0;
  background: none;
  font-size: 13px;
  color: #646d71;
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-thickness: 1px;
  cursor: pointer;
}
.plain:hover { color: #202426; }


/* ---- 标题 ---- */

header { padding: 36px 0 8px; }

h1 {
  margin: 0;
  font-size: 26px;
  font-weight: 600;
  letter-spacing: .08em;
}

.sub {
  margin: 2px 0 18px;
  font-size: 13px;
  color: #a3abaf;
  letter-spacing: .1em;
}

.intro {
  max-width: 34em;
  margin: 0 0 6px;
  text-align: justify;
}

.meta {
  margin: 14px 0 0;
  font-size: 13px;
  color: #a3abaf;
}
.meta > span { white-space: nowrap; }
.meta > span + span::before {
  content: "／";
  margin: 0 8px;
  color: #d5dbdd;
}
#count {
  color: #646d71;
  font-variant-numeric: tabular-nums;
}

/* 目录 */
.toc {
  margin: 12px 0 0;
  font-size: 13px;
}
.toc a {
  margin-right: 1em;
  white-space: nowrap;
}

.tools { margin: 10px 0 0; }


/* ---- 题目 ---- */

h2 {
  margin: 40px 0 10px;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: .06em;
}

.sheet {
  margin: 0;
  padding: 0;
  list-style: none;
  border-top: 1px solid #d5dbdd;
}

/* 一道题一行，题号在左边 */
.q {
  position: relative;
  padding: 14px 0 16px 2.6em;
  border-bottom: 1px solid #d5dbdd;
}
.no {
  position: absolute;
  left: 0;
  top: 14px;
  color: #a3abaf;
  font-variant-numeric: tabular-nums;
}
.t { margin: 0 0 4px; }
.hint {
  margin-left: .8em;
  font-size: 12px;
  color: #a3abaf;
  white-space: nowrap;
}

/* 填字的框 */
.field {
  display: block;
  width: 100%;
  max-width: 20em;
  margin-top: 6px;
  padding: 4px 8px;
  border: 1px solid #d5dbdd;
  border-radius: 0;
  background: #fbfcfc;
  font-size: 14px;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
}
.field:focus { border-color: #646d71; }
.field::placeholder { color: #a3abaf; }

/* 年龄：框短一点，后面跟一个「岁」。不要上下调数字的小箭头 */
.age {
  position: relative;
  display: block;
  max-width: 9em;
}
.age .field {
  padding-right: 2.2em;
  -moz-appearance: textfield;
}
.age .field::-webkit-outer-spin-button,
.age .field::-webkit-inner-spin-button {
  margin: 0;
  -webkit-appearance: none;
}
.age span {
  position: absolute;
  right: 9px;
  bottom: 5px;
  font-size: 13px;
  line-height: 1.75;
  color: #a3abaf;
}

/* 选项。长的一行一个；短的（五个字以内）横着排 */
.opts {
  margin: 4px 0 0;
  font-size: 14px;
  line-height: 1.75;
}
.opts label {
  display: block;
  padding: 3px 0;
  cursor: pointer;
}
/* 横着排的用一样宽的格子，这样每一题的 A、B、C、D 上下都对得齐 */
.opts.flow {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(8.2em, 1fr));
  column-gap: 1em;
}
.opts input {
  margin: 0 .55em 0 0;
  vertical-align: -1px;
  accent-color: #646d71;
}
.opts .l {
  margin-right: .6em;
  color: #a3abaf;
}

/* 没填的题 */
.q.invalid .no { color: #202426; }
.err {
  margin: 6px 0 0;
  font-size: 13px;
  color: #202426;
}
#form-alert {
  margin: 18px 0 0;
  padding: 8px 12px;
  border: 1px solid #d5dbdd;
  background: #fbfcfc;
  font-size: 14px;
}

.note {
  margin: 8px 0 0;
  font-size: 13px;
  color: #a3abaf;
}

/* 最下面：一句说明，一个提交 */
.end {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
  margin-top: 16px;
}
.end .note { margin: 0; }


/* ---- 交完以后 ---- */

#completion {
  max-width: 32em;
  margin: 0 auto;
  padding: 18vh 0 6vh;
}

.done {
  margin: 0 0 14px;
  font-size: 13px;
  color: #a3abaf;
  letter-spacing: .1em;
}
.done:focus { outline: none; }

/* 第一句 */
#completion-greeting {
  min-height: 1.85em;
  margin: 0 0 6px;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: .04em;
  line-height: 1.85;
  overflow-wrap: anywhere;
}

/* 第二句。停两秒以后才出现，用干掉的血的颜色；打完以后，字下面有几滴往下淌。
   这一段的写法是从原来的问卷照搬过来的。 */
#completion-correction {
  position: relative;
  isolation: isolate;
  min-height: 1.85em;
  margin: 0 0 36px;
  font-size: 21px;
  font-weight: 600;
  letter-spacing: .04em;
  line-height: 1.85;
  overflow-wrap: anywhere;
  color: #730b17;
  text-shadow: 0 1px 0 rgba(57, 4, 10, .3), 0 2px 2px rgba(98, 8, 19, .18), 0 0 5px rgba(138, 17, 36, .14);
  visibility: hidden;
  opacity: 0;
}
#completion-correction.is-revealed {
  visibility: visible;
  opacity: 1;
}
#completion-correction::before {
  content: "";
  position: absolute;
  top: -5px; right: -3px; bottom: -8px; left: -3px;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 18% 60%, rgba(119, 9, 25, .055), transparent 55%),
    radial-gradient(ellipse at 68% 75%, rgba(100, 5, 17, .045), transparent 46%);
  filter: blur(2px);
}
#completion-correction::after {
  content: "";
  display: none;
  position: absolute;
  left: 0;
  bottom: -7px;
  width: 245px;
  max-width: 90%;
  height: 18px;
  opacity: .86;
  pointer-events: none;
  background:
    linear-gradient(#620a15, #8a1421) 12% 0 / 2px 10px no-repeat,
    radial-gradient(ellipse, #7f1020 52%, transparent 64%) 12% 7px / 4px 7px no-repeat,
    linear-gradient(#730b17, #610911) 49% 0 / 2px 5px no-repeat,
    radial-gradient(ellipse, #730b17 52%, transparent 65%) 49% 3px / 3px 5px no-repeat,
    linear-gradient(#590711, #8b1423) 81% 0 / 2px 13px no-repeat,
    radial-gradient(ellipse, #7c0e1d 52%, transparent 65%) 81% 10px / 4px 7px no-repeat;
}
#completion-correction.is-typed::after { display: block; }

@supports ((-webkit-background-clip: text) or (background-clip: text)) {
  #completion-correction {
    background-image: linear-gradient(178deg, #4c0610 0%, #7e1020 35%, #650912 65%, #96202c 90%, #590812 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
}
@media (forced-colors: active) {
  #completion-correction {
    color: CanvasText;
    -webkit-text-fill-color: CanvasText;
    background: none;
    text-shadow: none;
  }
  #completion-correction::before,
  #completion-correction::after { display: none; }
}

.acts { margin: 26px 0 28px; }
.acts .btn + .btn { margin-left: 8px; }


/* ---- 清空之前再问一次。和进门那一页一个样子 ---- */

#ask {
  position: fixed;
  top: 0; right: 0; bottom: 0; left: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 16px;
  background: #f5f7f7;
}
#ask div {
  width: 100%;
  max-width: 420px;
  text-align: center;
}
#ask p { margin: 0 0 4px; }
#ask small {
  display: block;
  margin: 0 0 18px;
  font-size: 12px;
  color: #a3abaf;
}
#ask .btn + .btn { margin-left: 8px; }


/* ---- 页脚 ---- */

footer {
  margin-top: 48px;
  padding-top: 14px;
  border-top: 1px solid #d5dbdd;
  font-size: 12px;
  line-height: 1.9;
  color: #a3abaf;
}
footer p { margin: 0; }


/* ---- 手机 ---- */
@media (max-width: 560px) {
  .q { padding-left: 2.2em; }
  .opts label { padding: 8px 0; }           /* 手指好点 */
  .opts.flow { grid-template-columns: repeat(auto-fill, minmax(7.4em, 1fr)); }
  .field { font-size: 16px; }               /* 小于 16px 的话，苹果手机一点输入框就会放大页面 */
  .end {
    flex-direction: column;
    align-items: stretch;
  }
  .end .btn { padding: 9px 16px; }
  .acts .btn { padding: 7px 16px; }
  #completion { padding-top: 12vh; }
  #completion-greeting { font-size: 20px; }
  #completion-correction { font-size: 19px; }
}

/* ---- 平板、小一点的笔记本 ---- */
@media (min-width: 900px) {
  body { padding: 0 40px; }
  .page { max-width: 900px; }
}

/* ---- 电脑：左边标题和说明，右边题目 ---- */
@media (min-width: 1100px) {
  body {
    padding: 0 48px;
    font-size: 16px;
  }
  .page {
    max-width: 1240px;
    padding-top: 28px;
  }

  #form-view {
    display: grid;
    grid-template-columns: minmax(280px, 360px) 1fr;
    column-gap: 64px;
    align-items: start;
  }

  /* 左边这一栏往下翻的时候停在原处 */
  header {
    position: sticky;
    top: 0;
    padding: 40px 0 8px;
  }
  h1 { font-size: 28px; }
  .intro { max-width: none; }

  /* 窄栏里，一行一项 */
  .meta { margin-top: 22px; line-height: 2; }
  .meta > span { display: block; }
  .meta > span + span::before { content: none; }
  .toc { margin-top: 18px; line-height: 2; }
  .toc a { display: block; margin: 0; }

  .opts, .field { font-size: 15px; }
  .note, .err, .plain { font-size: 14px; }
  #form-alert { font-size: 15px; }
  footer { font-size: 13px; }
}

/* ---- 大屏：16 寸、外接显示器 ---- */
@media (min-width: 1500px) {
  body {
    padding: 0 64px;
    font-size: 17px;
  }
  .page { max-width: 1400px; }
  #form-view {
    grid-template-columns: minmax(320px, 400px) 1fr;
    column-gap: 88px;
  }
  h1 { font-size: 30px; }
  h2 { font-size: 17px; }
  .opts, .field { font-size: 16px; }
  .btn { font-size: 15px; }
  #form-alert { font-size: 16px; }
  #completion-greeting { font-size: 24px; }
  #completion-correction { font-size: 23px; }
}
</style>
</head>

<body>

<div id="grain"></div>

<!-- 清空之前再问一次 -->
<div id="ask" role="dialog" aria-modal="true" aria-labelledby="ask-title" hidden>
  <div>
    <p id="ask-title">清空所有回答？</p>
    <small>当前填写内容将被清除。此操作无法撤销。</small>
    <button class="btn" id="cancel-clear" type="button">保留回答</button><button class="btn" id="confirm-clear" type="button">确认清空</button>
  </div>
</div>

<div class="page" id="page">

  <!-- 填的时候 -->
  <div id="form-view">

    <header>
      <h1>访客问卷</h1>
      <p class="sub">关于你的一些问题。</p>
      <p class="intro">共15题。请按照你的直觉填写。请依照你的实际感受作答。多选题已单独标注。</p>
      <p class="meta"><span>所有题目均需填写</span><span>两道多选题</span><span>已填 <span id="count">00</span> / 15</span><span id="save-label">填写时自动保存</span></p>
      <p class="toc" id="toc"></p>
      <p class="tools"><button class="plain" id="clear-button" type="button">清空回答</button></p>
      <p class="sr-only" id="progress-announcement" aria-live="polite"></p>
    </header>

    <div class="main">
      <noscript><p class="note">当前打开方式未启用互动。填写、提交和结尾需要浏览器允许网页脚本运行。请启用后重新打开本网页。</p></noscript>

      <form id="questionnaire" novalidate aria-label="访客问卷">
        <!-- 题目是脚本照着下面那张单子排出来的 -->
        <div id="sheet"></div>

        <p id="form-alert" role="alert" hidden></p>

        <div class="end">
          <p class="note">填写内容仅保存在当前设备。<br>完成后可下载你的回答。</p>
          <button class="btn" id="submit-button" type="submit" disabled>提交问卷</button>
        </div>
      </form>
    </div>

  </div>

  <!-- 交完以后 -->
  <section id="completion" aria-labelledby="completion-heading" hidden>
    <p class="done" id="completion-heading" tabindex="-1">记录完成。</p>
    <p id="completion-greeting"></p>
    <p id="completion-correction" aria-hidden="true"></p>
    <p class="note" id="complete-description"></p>
    <p class="acts"><button class="btn" id="download-button" type="button">下载回答</button><button class="btn" id="edit-button" type="button">修改回答</button></p>
    <p class="note">本问卷为虚构游戏内容，请勿代入现实。</p>
  </section>

  <footer>
    <p>© 2026 近期连环命案汇总</p>
  </footer>

</div>


<script>
(function () {

  function $(id) {
    return document.getElementById(id);
  }

  // 补零：7 -> "07"
  function two(n) {
    return n < 10 ? '0' + n : '' + n;
  }

  function trim(s) {
    return s.replace(/^\s+|\s+$/g, '');
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
  }

  // 是不是整数
  function whole(n) {
    return typeof n === 'number' && isFinite(n) && Math.floor(n) === n;
  }


  /* =========================================================
     题目。一共十五道，分四段。
     题目和选项跟原来的问卷一个字不差。存答案用的也是同一个名字。
     ========================================================= */

  var KEY = 'visitor-questionnaire-001-v1';

  var SECTIONS = [
    { id: 'section-1', label: '基本信息',   ids: [1, 2, 3, 4] },
    { id: 'section-2', label: '生活与偏好', ids: [5, 6, 7, 8] },
    { id: 'section-3', label: '自我与判断', ids: [9, 10, 11, 12] },
    { id: 'section-4', label: '立场与来意', ids: [13, 14, 15] }
  ];

  // type：text 填字　age 填年龄　single 单选　multi 多选
  var QUESTIONS = [
    { id: 1, type: 'text', title: '你的姓名：' },
    { id: 2, type: 'age', title: '你的年龄：' },
    {
      id: 3, type: 'single', title: '你平时喜欢社交吗？',
      options: ['非常喜欢', '还算喜欢', '不喜欢', '非常讨厌']
    },
    {
      id: 4, type: 'multi', title: '你的爱好偏向于什么？', hint: '多选题',
      options: ['艺术类', '运动类', '流行类（如：追星，看综艺，追剧等）', '游戏类', '食物类', '学术类', '不知']
    },
    {
      id: 5, type: 'single', title: '你觉得你的原生家庭怎么样？',
      options: [
        '非常好，整体很温馨，家人很爱我理解我',
        '正常，可能会有小摩擦，但整体还是有爱的',
        '不太好，经常会有摩擦，感觉家人的爱模棱两可',
        '非常不好，感觉家里根本没有爱和感情'
      ]
    },
    {
      id: 6, type: 'single', title: '你平常的社交方式偏向？',
      options: ['网络社交', '线下社交', '两者都有', '不爱社交']
    },
    {
      id: 7, type: 'single', title: '你怎么看待恐怖元素？',
      options: ['超爱，经常看恐怖电影，玩恐怖游戏', '一般，遇到感兴趣的题材会主动接触', '害怕，没胆量接触', '讨厌，感觉很没意思']
    },
    {
      id: 8, type: 'single', title: '你讨厌灰尘吗？',
      options: ['讨厌，我恨一切脏东西', '一般，但看到会觉得膈应', '还好，不影响我就好', '感觉别具风情']
    },
    {
      id: 9, type: 'single', title: '你觉得自己成功吗？',
      options: ['非常成功', '非常失败']
    },
    {
      id: 10, type: 'single', title: '你喜欢探讨“道德”吗？',
      options: ['当然喜欢', '看什么主题', '不喜欢，很无聊', '讨厌，讨厌所有用道德约束别人的人']
    },
    {
      id: 11, type: 'multi', title: '你的朋友觉得你像什么部位？', hint: '多选题',
      options: ['头颅', '躯干', '手臂', '大腿', '小腿', '脚', '眼睛', '嘴巴', '鼻子']
    },
    {
      id: 12, type: 'single', title: '当你遇到一件事，但无关痛痒，你会立刻解决吗',
      options: ['不会，既然都无关痛痒了', '考虑，但应该不会立刻解决', '脑子想解决，但不想动', '想动的时候会去解决']
    },
    {
      id: 13, type: 'single', title: '你觉得人性本什么？',
      options: ['恶', '善', '非恶非善']
    },
    {
      id: 14, type: 'single', title: '你觉得杀人的人是什么样的？',
      options: ['有罪', '有德', '非罪非德']
    },
    {
      id: 15, type: 'single', title: '你来网站的原因是什么？',
      options: [
        '感兴趣，网站有全部近期连环杀人案的细节，不用自己搜索',
        '好奇最近的事，来看集合网站更方便',
        '闲来无事，又懒得一个个找这几个案子，打发时间'
      ]
    }
  ];

  var LETTERS = 'ABCDEFGHIJ';


  /* =========================================================
     把题目排到页面上
     ========================================================= */

  function optionsHTML(q) {
    var kind = q.type === 'multi' ? 'checkbox' : 'radio';
    var longest = 0, i;
    for (i = 0; i < q.options.length; i++) {
      if (q.options[i].length > longest) longest = q.options[i].length;
    }

    // 选项都在五个字以内的，横着排；有长的，一行一个
    var h = '<div class="opts' + (longest <= 5 ? ' flow' : '') + '">';
    for (i = 0; i < q.options.length; i++) {
      h += '<label>'
         + '<input type="' + kind + '" name="q' + q.id + '" value="' + i + '" id="answer-' + q.id + '-' + i + '" aria-describedby="error-' + q.id + '">'
         + '<span class="l" aria-hidden="true">' + LETTERS.charAt(i) + '</span>'
         + esc(q.options[i])
         + '</label>';
    }
    return h + '</div>';
  }

  function questionHTML(q) {
    var label = ' aria-labelledby="title-' + q.id + '" aria-describedby="error-' + q.id + '" aria-required="true"';
    var h = '<li class="q" id="question-' + q.id + '" role="group" aria-labelledby="title-' + q.id + '">';
    h += '<span class="no" aria-hidden="true">' + two(q.id) + '</span>';
    h += '<p class="t" id="title-' + q.id + '">' + esc(q.title)
       + (q.hint ? '<span class="hint">' + esc(q.hint) + '</span>' : '') + '</p>';

    if (q.type === 'text') {
      h += '<input class="field" id="answer-' + q.id + '" name="q' + q.id + '" type="text" autocomplete="name" maxlength="100" placeholder="填写你的姓名"' + label + '>';
    } else if (q.type === 'age') {
      h += '<span class="age">'
         + '<input class="field" id="answer-' + q.id + '" name="q' + q.id + '" type="number" min="1" max="120" step="1" inputmode="numeric" placeholder="填写年龄"' + label + '>'
         + '<span aria-hidden="true">岁</span>'
         + '</span>';
    } else {
      h += optionsHTML(q);
    }

    h += '<p class="err" id="error-' + q.id + '" hidden></p>';
    return h + '</li>';
  }

  function build() {
    var sheet = '', toc = '';
    for (var s = 0; s < SECTIONS.length; s++) {
      var sec = SECTIONS[s];
      sheet += '<h2 id="' + sec.id + '">' + sec.label + '</h2>';
      sheet += '<ol class="sheet">';
      for (var k = 0; k < sec.ids.length; k++) sheet += questionHTML(QUESTIONS[sec.ids[k] - 1]);
      sheet += '</ol>';
      toc += '<a href="#' + sec.id + '">' + sec.label + '</a>';
    }
    $('sheet').innerHTML = sheet;
    $('toc').innerHTML = toc;
  }


  /* =========================================================
     答案
     ========================================================= */

  var answers = {};           // 题号 -> 答案。填字的是字符串，单选是第几个，多选是一串第几个
  var completed = false;      // 交过了没有
  var canStore = true;        // 这个浏览器让不让存
  var checking = false;       // 交过一次、有没填的，之后每改一题就重新查一题

  // 读上次存的。不认识的东西一律不要
  try {
    var raw = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (raw && typeof raw.answers === 'object' && raw.answers !== null) {
      for (var r = 0; r < QUESTIONS.length; r++) {
        var rq = QUESTIONS[r], ra = raw.answers[rq.id];
        if (rq.type === 'text' || rq.type === 'age') {
          if (typeof ra === 'string') answers[rq.id] = ra;
        } else if (rq.type === 'multi') {
          if (Array.isArray(ra)) {
            var kept = [];
            for (var m = 0; m < ra.length; m++) {
              if (whole(ra[m]) && ra[m] >= 0 && ra[m] < rq.options.length) kept.push(ra[m]);
            }
            answers[rq.id] = kept;
          }
        } else if (whole(ra) && ra >= 0 && ra < rq.options.length) {
          answers[rq.id] = ra;
        }
      }
      completed = raw.completed === true;
    }
  } catch (e) {
    canStore = false;
  }

  // 这一题哪里不对。没问题就是空的
  function errorFor(q) {
    var a = answers[q.id];
    if (q.type === 'text') {
      return typeof a === 'string' && trim(a) ? '' : '请填写你的姓名。';
    }
    if (q.type === 'age') {
      var n = Number(a);
      return typeof a === 'string' && /^\d+$/.test(a) && n >= 1 && n <= 120 ? '' : '请填写1—120之间的整数年龄。';
    }
    if (q.type === 'multi') {
      return Array.isArray(a) && a.length ? '' : '请至少选择一项。';
    }
    return whole(a) && a >= 0 && a < q.options.length ? '' : '请选择一项。';
  }

  // 还没填好的题
  function missing() {
    var list = [];
    for (var i = 0; i < QUESTIONS.length; i++) {
      if (errorFor(QUESTIONS[i])) list.push(QUESTIONS[i]);
    }
    return list;
  }

  function inputsOf(q) {
    return $('questionnaire').querySelectorAll('[name="q' + q.id + '"]');
  }

  function checkedOf(q) {
    var inputs = inputsOf(q), list = [];
    for (var i = 0; i < inputs.length; i++) {
      if (inputs[i].checked) list.push(Number(inputs[i].value));
    }
    return list;
  }

  // 把存着的答案摆回页面上
  function restoreInputs() {
    for (var i = 0; i < QUESTIONS.length; i++) {
      var q = QUESTIONS[i];
      if (q.type === 'text' || q.type === 'age') {
        $('answer-' + q.id).value = answers[q.id] || '';
        continue;
      }
      var inputs = inputsOf(q);
      for (var k = 0; k < inputs.length; k++) {
        var v = Number(inputs[k].value);
        inputs[k].checked = q.type === 'multi' ? (answers[q.id] || []).indexOf(v) > -1 : answers[q.id] === v;
      }
    }
  }

  // 把页面上的全部读一遍（提交的时候用，免得漏掉浏览器自己填的）
  function readAllInputs() {
    for (var i = 0; i < QUESTIONS.length; i++) {
      var q = QUESTIONS[i];
      if (q.type === 'text' || q.type === 'age') {
        answers[q.id] = $('answer-' + q.id).value;
      } else if (q.type === 'multi') {
        answers[q.id] = checkedOf(q);
      } else {
        var picked = checkedOf(q);
        if (picked.length) answers[q.id] = picked[0];
        else delete answers[q.id];
      }
    }
  }

  function showError(q) {
    var message = errorFor(q);
    var row = $('question-' + q.id), el = $('error-' + q.id);
    row.className = message ? 'q invalid' : 'q';
    el.innerHTML = esc(message);
    el.hidden = !message;
    var inputs = row.getElementsByTagName('input');
    for (var k = 0; k < inputs.length; k++) {
      if (message) inputs[k].setAttribute('aria-invalid', 'true');
      else inputs[k].removeAttribute('aria-invalid');
    }
  }

  function clearErrors() {
    checking = false;
    $('form-alert').hidden = true;
    for (var i = 0; i < QUESTIONS.length; i++) {
      var row = $('question-' + QUESTIONS[i].id);
      row.className = 'q';
      $('error-' + QUESTIONS[i].id).hidden = true;
      var inputs = row.getElementsByTagName('input');
      for (var k = 0; k < inputs.length; k++) inputs[k].removeAttribute('aria-invalid');
    }
  }

  function showAlert() {
    var left = missing().length;
    $('form-alert').hidden = !left;
    if (left) $('form-alert').innerHTML = '还有' + left + '道题需要填写，请检查标注的位置。';
  }

  function updateProgress(announce) {
    var done = QUESTIONS.length - missing().length;
    $('count').innerHTML = two(done);
    if (announce) $('progress-announcement').innerHTML = '已完成' + done + '题，共15题。';
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ answers: answers, completed: completed }));
      canStore = true;
      $('save-label').innerHTML = '已自动保存至此设备';
    } catch (e) {
      canStore = false;
      $('save-label').innerHTML = '回答保留在当前页面';
    }
  }


  /* =========================================================
     结尾的两句话
     第一句一个字一个字打出来（每个字 0.1 秒），停两秒，再打第二句。
     ========================================================= */

  var CHAR_DELAY = 100;
  var LINE_PAUSE = 2000;

  var endingTimer = null;
  var endingRun = 0;          // 每换一次页面加一。打到一半被打断的，对不上号就不接着打了

  function cancelEnding() {
    endingRun++;
    if (endingTimer !== null) {
      clearTimeout(endingTimer);
      endingTimer = null;
    }
  }

  function playEnding(first, second) {
    var run = endingRun;
    var greeting = $('completion-greeting'), correction = $('completion-correction');

    function current() {
      return run === endingRun && completed;
    }

    function later(fn, ms) {
      endingTimer = setTimeout(function () {
        endingTimer = null;
        if (current()) fn();
      }, ms);
    }

    function type(el, text, after) {
      // 一个字一个字拆开。有的字（表情之类）在电脑里占两格，不能拆成两半
      var chars = text.match(/[\uD800-\uDBFF][\uDC00-\uDFFF]|[\s\S]/g) || [];
      var i = 0;
      function next() {
        if (!current()) return;
        if (i < chars.length) el.appendChild(document.createTextNode(chars[i++]));
        if (i < chars.length) later(next, CHAR_DELAY);
        else if (after) after();
      }
      next();
    }

    type(greeting, first, function () {
      later(function () {
        correction.className = 'is-revealed';
        correction.removeAttribute('aria-hidden');
        type(correction, second, function () {
          correction.className = 'is-revealed is-typed';     // 打完了，血滴下来
        });
      }, LINE_PAUSE);
    });
  }

  // done：true 是交完以后那一页，false 是填的那一页
  function setView(done, focus) {
    cancelEnding();
    completed = done;

    var name = trim(String(answers[1] || ''));
    var picked = Array.isArray(answers[11]) ? answers[11].slice() : [];
    picked.sort(function (a, b) { return a - b; });
    var parts = [];
    for (var i = 0; i < picked.length; i++) parts.push(QUESTIONS[10].options[picked[i]]);

    var first = name + '，谢谢你的回答。';
    var second = '不对……' + parts.join('、') + '，谢谢你的回答。';

    var greeting = $('completion-greeting'), correction = $('completion-correction');
    greeting.innerHTML = '';
    correction.innerHTML = '';
    correction.className = '';
    correction.setAttribute('aria-hidden', 'true');

    $('form-view').hidden = done;
    $('completion').hidden = !done;
    $('complete-description').innerHTML = canStore
      ? '你的回答已保存在当前设备。<br>你可以返回修改，或下载一份自己的回答。'
      : '你的回答已在当前页面完成。<br>离开前可下载保存，或返回修改。';

    if (focus) {
      window.scrollTo(0, 0);
      if (done) $('completion-heading').focus();
      else $('answer-1').focus();
    }

    if (done) playEnding(first, second);
  }


  /* =========================================================
     填、交、改、下载、清空
     ========================================================= */

  // 每动一下就记下来、存起来
  function recordInput(e) {
    var input = e.target;
    if (!input || input.tagName !== 'INPUT' || !input.name) return;
    var id = Number(input.name.slice(1)), q = QUESTIONS[id - 1];
    if (!q) return;

    if (q.type === 'multi') answers[id] = checkedOf(q);
    else if (q.type === 'single') answers[id] = Number(input.value);
    else answers[id] = input.value;

    completed = false;
    save();
    updateProgress(true);

    if (checking) {
      showError(q);
      showAlert();
    }
  }

  $('questionnaire').addEventListener('input', recordInput);
  $('questionnaire').addEventListener('change', recordInput);

  $('questionnaire').onsubmit = function () {
    readAllInputs();
    updateProgress(true);
    checking = true;
    for (var i = 0; i < QUESTIONS.length; i++) showError(QUESTIONS[i]);

    var left = missing();
    if (left.length) {
      showAlert();
      // 翻到第一道没填的题
      var row = $('question-' + left[0].id);
      row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      row.getElementsByTagName('input')[0].focus({ preventScroll: true });
      return false;
    }

    $('form-alert').hidden = true;
    completed = true;
    save();
    setView(true, true);
    return false;
  };

  $('edit-button').onclick = function () {
    setView(false, true);
    save();
  };

  // 下载下来的文本和原来的问卷一样
  $('download-button').onclick = function () {
    var lines = ['访客问卷', 'VISITOR QUESTIONNAIRE', ''];
    for (var i = 0; i < QUESTIONS.length; i++) {
      var q = QUESTIONS[i], a = answers[q.id];
      lines.push(two(q.id) + '．' + q.title);
      if (q.type === 'text' || q.type === 'age') {
        lines.push(String(a || ''));
      } else if (q.type === 'multi') {
        for (var k = 0; k < (a || []).length; k++) lines.push(LETTERS.charAt(a[k]) + '．' + q.options[a[k]]);
      } else {
        lines.push(LETTERS.charAt(a) + '．' + q.options[a]);
      }
      lines.push('');
    }
    lines.push('本问卷为虚构游戏内容，请勿代入现实。');

    var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = '访客问卷_我的回答.txt';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  };

  // 清空之前再问一次。问的时候后面的页面碰不到
  function openAsk() {
    $('ask').hidden = false;
    $('page').inert = true;
    $('cancel-clear').focus();
  }

  function closeAsk() {
    $('ask').hidden = true;
    $('page').inert = false;
    $('clear-button').focus();
  }

  function clearAll() {
    answers = {};
    completed = false;
    clearErrors();
    restoreInputs();
    updateProgress(true);
    try { localStorage.removeItem(KEY); } catch (e) {}
    $('save-label').innerHTML = '填写时自动保存';
    $('ask').hidden = true;
    $('page').inert = false;
    setView(false, true);
  }

  $('clear-button').onclick = openAsk;
  $('cancel-clear').onclick = closeAsk;
  $('confirm-clear').onclick = clearAll;

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('ask').hidden) closeAsk();
  });


  /* =========================================================
     纸面上很淡的颗粒，和主页面一样
     ========================================================= */

  try {
    var gc = document.createElement('canvas');
    gc.width = 160;
    gc.height = 160;
    var gg = gc.getContext('2d');
    var dots = gg.createImageData(160, 160);
    for (var n = 0; n < dots.data.length; n += 4) {
      var grey = 90 + Math.floor(Math.random() * 80);
      dots.data[n]     = grey;
      dots.data[n + 1] = grey + 4;
      dots.data[n + 2] = grey + 6;
      dots.data[n + 3] = Math.floor(Math.random() * 9);
    }
    gg.putImageData(dots, 0, 0);
    $('grain').style.backgroundImage = 'url(' + gc.toDataURL() + ')';
  } catch (e) {}


  /* =========================================================
     开始
     ========================================================= */

  build();
  restoreInputs();
  updateProgress(false);

  var hasAny = false;
  for (var key in answers) { if (answers.hasOwnProperty(key)) hasAny = true; }
  if (hasAny) $('save-label').innerHTML = canStore ? '已恢复此设备上的回答' : '回答保留在当前页面';

  // 上次已经交过、而且十五道都还在，就直接到交完以后那一页
  setView(completed && missing().length === 0, false);

  $('submit-button').disabled = false;

})();
</script>

</body>
</html>
